name: Build Images And Deploy To VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.12.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test backend
        continue-on-error: true
        run: pnpm --filter=backend test:unit

      - name: Test storefront
        continue-on-error: true
        run: pnpm --filter=storefront test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set GHCR owner (lowercase)
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        run: |
          BACKEND_IMAGE="ghcr.io/${GHCR_OWNER}/dakkah-cityos-medusa-backend"
          docker build -f ./apps/backend/Dockerfile -t "${BACKEND_IMAGE}:latest" -t "${BACKEND_IMAGE}:${GITHUB_SHA}" .
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"

      - name: Build and push storefront image
        run: |
          STOREFRONT_IMAGE="ghcr.io/${GHCR_OWNER}/dakkah-cityos-medusa-storefront"
          docker build -f ./apps/storefront/Dockerfile -t "${STOREFRONT_IMAGE}:latest" -t "${STOREFRONT_IMAGE}:${GITHUB_SHA}" .
          docker push "${STOREFRONT_IMAGE}:latest"
          docker push "${STOREFRONT_IMAGE}:${GITHUB_SHA}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
      BACKEND_IMAGE: ghcr.io/mvp-lab-sa/dakkah-cityos-medusa-backend
      STOREFRONT_IMAGE: ghcr.io/mvp-lab-sa/dakkah-cityos-medusa-storefront

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy containers on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' \
             GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
             BACKEND_IMAGE='${BACKEND_IMAGE}' \
             STOREFRONT_IMAGE='${STOREFRONT_IMAGE}' \
             IMAGE_TAG='${IMAGE_TAG}' \
             bash -s" <<'REMOTE'
          set -e

          mkdir -p /srv/apps/marketplace/kashif-medusa

          cat > /srv/apps/marketplace/kashif-medusa/docker-compose.yml <<COMPOSE
          services:
            backend:
              image: ${BACKEND_IMAGE}:${IMAGE_TAG}
              container_name: kashif-medusa-backend
              restart: unless-stopped
              env_file:
                - ./backend.env
              ports:
                - "9000:9000"

            storefront:
              image: ${STOREFRONT_IMAGE}:${IMAGE_TAG}
              container_name: kashif-medusa-storefront
              restart: unless-stopped
              env_file:
                - ./storefront.env
              ports:
                - "8000:8000"
              depends_on:
                - backend
          COMPOSE

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd /srv/apps/marketplace/kashif-medusa
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
REMOTE
