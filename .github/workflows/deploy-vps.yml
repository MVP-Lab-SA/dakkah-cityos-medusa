name: Build Images And Deploy To VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test backend
        run: pnpm --filter=backend test:unit

      - name: Test storefront
        run: pnpm --filter=storefront test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dakkah-cityos-medusa-backend:latest
            ghcr.io/${{ github.repository_owner }}/dakkah-cityos-medusa-backend:${{ github.sha }}

      - name: Build and push storefront image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/storefront/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dakkah-cityos-medusa-storefront:latest
            ghcr.io/${{ github.repository_owner }}/dakkah-cityos-medusa-storefront:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/dakkah-cityos-medusa-backend
      STOREFRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/dakkah-cityos-medusa-storefront

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy containers on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            mkdir -p /srv/apps/marketplace/kashif-medusa
            cat > /srv/apps/marketplace/kashif-medusa/docker-compose.yml <<'EOF'
            services:
              backend:
                image: ${BACKEND_IMAGE}:${IMAGE_TAG}
                container_name: kashif-medusa-backend
                restart: unless-stopped
                env_file:
                  - ./backend.env
                ports:
                  - \"9000:9000\"

              storefront:
                image: ${STOREFRONT_IMAGE}:${IMAGE_TAG}
                container_name: kashif-medusa-storefront
                restart: unless-stopped
                env_file:
                  - ./storefront.env
                ports:
                  - \"8000:8000\"
                depends_on:
                  - backend
            EOF

            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin
            cd /srv/apps/marketplace/kashif-medusa
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          "
