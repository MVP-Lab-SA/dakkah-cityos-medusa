# VPS stack: Redis + Medusa + storefront. PostgreSQL is external (Neon).
# Compose `.env`: BACKEND_IMAGE, STOREFRONT_IMAGE, IMAGE_TAG.
# Meilisearch is omitted: medusa-config enables ./src/modules/meilisearch only when
# MEILISEARCH_HOST is set, but that module is not present in this repo (would crash).
name: kashif-medusa

services:
  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: kashif-medusa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - medusa_redisdata:/data

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: kashif-medusa-backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_started

  storefront:
    image: ${STOREFRONT_IMAGE}:${IMAGE_TAG}
    container_name: kashif-medusa-storefront
    restart: unless-stopped
    env_file:
      - ./storefront.env
    ports:
      - "8000:8000"
    depends_on:
      - backend

volumes:
  medusa_redisdata:
