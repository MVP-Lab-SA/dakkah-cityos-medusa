# Full Medusa stack for VPS. Compose reads `.env` in the same directory for
# POSTGRES_PASSWORD, MEILI_MASTER_KEY, BACKEND_IMAGE, STOREFRONT_IMAGE, IMAGE_TAG.
name: kashif-medusa

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: kashif-medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa
    volumes:
      - medusa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: kashif-medusa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - medusa_redisdata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: kashif-medusa-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: kashif-medusa-backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  storefront:
    image: ${STOREFRONT_IMAGE}:${IMAGE_TAG}
    container_name: kashif-medusa-storefront
    restart: unless-stopped
    env_file:
      - ./storefront.env
    ports:
      - "8000:8000"
    depends_on:
      - backend

volumes:
  medusa_pgdata:
  medusa_redisdata:
